<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shelly's Appointments</title><style>body{margin:0;background:#f6f7f5;color:#243028;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:28px 16px 50px}header,section{background:#fff;border:1px solid #e1e6e1;border-radius:18px;padding:20px;margin-bottom:14px}h1{margin:0;font-size:28px}.day{font-weight:700;font-size:20px;margin-bottom:12px}.row{display:grid;grid-template-columns:90px 1fr 1fr;gap:12px;border-top:1px solid #edf0ed;padding:12px 0}.time{font-weight:700}.label{font-size:11px;color:#788078;text-transform:uppercase;letter-spacing:.05em}.value{font-size:16px}@media(max-width:520px){.row{grid-template-columns:70px 1fr 1fr;gap:8px}.value{font-size:15px}}</style></head><body><main><header><h1>Shelly's Appointments</h1></header><div id="appointments">Loading appointments…</div></main><script>fetch('appointments.json?'+Date.now()).then(r=>r.json()).then(data=>{const root=document.getElementById('appointments');const groups={};data.appointments.forEach(a=>(groups[a.date]??=[]).push(a));root.innerHTML='';Object.keys(groups).sort().forEach(date=>{const d=new Date(date+'T12:00:00');const section=document.createElement('section');const day=document.createElement('div');day.className='day';day.textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});section.appendChild(day);groups[date].sort((a,b)=>a.time.localeCompare(b.time)).forEach(a=>{const row=document.createElement('div');row.className='row';row.innerHTML='<div class="time">'+a.time+'</div><div><div class="label">Horse</div><div class="value">'+a.horse+'</div></div><div><div class="label">Owner</div><div class="value">'+a.owner+'</div></div>';section.appendChild(row)});root.appendChild(section)})}).catch(()=>{document.getElementById('appointments').textContent='Unable to load appointments.'});</script></body></html>
